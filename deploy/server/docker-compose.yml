# CrossStream server, bridge mode with published ports (Docker Desktop, tests).
# Linux production: add -f docker-compose.host.yml (see README.md).
services:
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      target: server
    # remote-deploy.sh keeps XS_IMAGE_TAG in .env at the deployed version.
    image: crossstream/xs-server:${XS_IMAGE_TAG:-dev}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    # Hardening (setup-cases.md section 4): read-only root FS (state lives in
    # /data, the control socket in /run), no core dumps (key material), bounded
    # logs, namespaced sysctls here; host-wide ones in 90-crossstream.conf.
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: 0
    logging:
      driver: json-file
      options: { max-size: 50m, max-file: "3" }
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.default.rp_filter: "2"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.secure_redirects: "0"
      net.ipv4.conf.default.secure_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
    ports:
      - "51900:51900/udp"
      - "443:443/udp"
      - "51900:51900/tcp" # TCP transport (carriers that block UDP)
      - "443:443/tcp"     # WSS transport (looks like HTTPS)
      # Web panel: on this machine only. Remote: ssh -L 8443:localhost:8443 <server>
      - "127.0.0.1:8443:8443/tcp"
    volumes:
      - ./data:/data
    environment:
      # Addresses put into enrollment codes (comma-separated host, host:port or URL).
      # Needed behind NAT and on Docker Desktop, e.g. your router's public address.
      XS_SERVER_PUBLIC_ENDPOINTS: ${XS_SERVER_PUBLIC_ENDPOINTS:-}
      XS_SERVER_LISTEN_PORTS: ${XS_SERVER_LISTEN_PORTS:-51900,443}
      # Refuse hubs older than this (vX.Y.Z); empty = any version.
      XS_SERVER_MIN_HUB_VERSION: ${XS_SERVER_MIN_HUB_VERSION:-}
      # Private prefixes hubs may still reach (egress filter exceptions), e.g. 192.168.88.0/24.
      XS_SERVER_EGRESS_ALLOW: ${XS_SERVER_EGRESS_ALLOW:-}
      # Prometheus /metrics on a loopback/private address only, e.g. 127.0.0.1:9100 (host mode).
      XS_SERVER_METRICS_LISTEN: ${XS_SERVER_METRICS_LISTEN:-}
      # Web panel (https://localhost:8443). Bridge mode: the container listens on
      # all its addresses, the host publishes 127.0.0.1:8443 only (see ports).
      # Host mode (docker-compose.host.yml) binds 127.0.0.1:8443 directly.
      # "off" turns the panel off. Admins: docker compose exec server xs-ctl admin add <user>
      XS_SERVER_WEB_LISTEN: ${XS_SERVER_WEB_LISTEN:-0.0.0.0:8443}
      XS_SERVER_WEB_ALLOW_PUBLIC: "true"
