name: CrossStream Server
version: "0.11.0"
slug: crossstream_server
description: Bonding server for CrossStream hubs (multi-phone cellular bonding)
url: https://github.com/zyndata/cross-stream
arch: [aarch64, amd64]
image: ghcr.io/zyndata/crossstream-server
startup: services
boot: auto
privileged: [NET_ADMIN]
devices: [/dev/net/tun]
tmpfs: true
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: CrossStream
panel_admin: true
backup: hot # state.json is written atomically
ports:
  51900/udp: 51900
  51900/tcp: 51900
  443/udp: null # off by default: HA installs often use 443 already
  443/tcp: null
  9100/tcp: null # Prometheus /metrics for external scrapers
options:
  public_endpoints: []
  pep: true
  log_level: info
  min_hub_version: ""
  egress_allow: []
  port_443: false
schema:
  public_endpoints: [str]
  pep: bool
  log_level: list(debug|info|warn|error)
  min_hub_version: str?
  egress_allow: [str]
  port_443: bool
